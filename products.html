    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Deeba's Thread</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="/images/logo.jpeg" type="image/jpeg">

</head>
<body>
    <noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1218102708053235&ev=PageView&noscript=1"
/></noscript>
    <div id="nav-placeholder"></div>
    
    <main>
        <section class="section">
            <div class="container">
                <h1 class="section-title">Our Collection</h1>
                <div class="products-grid" id="products-container">
                    <!-- Products will be dynamically loaded here -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/products.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script>
        // Display all products on products page
        document.addEventListener('DOMContentLoaded', function() {
            const productsContainer = document.getElementById('products-container');
            if (productsContainer) {
                products.forEach(product => {
                    const productCard = document.createElement('a');
                    productCard.href = `product.html?slug=${product.slug}`;
                    productCard.className = 'product-card';
                    productCard.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" class="product-image">
                        <div class="product-info">
                            <h3 class="product-name">${product.name}</h3>
                            <p class="product-category">${product.category}</p>
                            <p class="product-price">${formatPrice(product.price)}</p>
                        </div>
                    `;
                    productsContainer.appendChild(productCard);
                });
            }
        });
    </script>
</body>
